<!-- ========================== Settings Panel start ==================================== -->
<div class="settings-panel position-fixed top-50 translate-middle-y tw-z-999 d-flex align-items-center"
  [class.active]="isSettingsPanelOpen">
  <button type="button"
    class="settings-button tw-w-12 tw-h-12 bg-main-600 text-white hover-bg-main-800 tw-duration-100 d-flex justify-content-center align-items-center"
    [class.active]="isSettingsButtonActive" (click)="onSettingsButtonClick($event)">
    <i class="ph-fill ph-gear-six setting-icon tw-text-2xl tw-leading-none animation-rotate tw-w-6 tw-h-6"></i>
    <i class="ph-bold ph-x close-icon tw-text-2xl tw-leading-none tw-w-6 tw-h-6"></i>
  </button>

  <div class="settings-panel__content bg-white tw-px-6 tw-py-13 d-flex flex-column tw-gap-10 scroll-sm overflow-y-auto"
    [class.active]="isSettingsPanelOpen">
    <div class="d-flex flex-column tw-gap-10">

      <!-- Cursor Section -->
      <div>
        <h6 class="settings-panel__title text-center tw-mb-6 text-uppercase">
          Cursor
        </h6>
        <div class="settings-panel__buttons cursor__buttons d-flex tw-gap-4">
          <button type="button"
            class="settings-panel__button cursor-animate bg-main-two-600 hover-bg-main-600 tw-duration-300 text-white tw-text-base tw-py-305 tw-px-3 fw-medium active-scale-094 flex-grow-1"
            [class.active]="cursorType === 'animate'" (click)="onCursorAnimateClick($event)">
            Animate
          </button>
          <button type="button"
            class="settings-panel__button cursor-default bg-main-two-600 hover-bg-main-600 tw-duration-300 text-white tw-text-base tw-py-305 tw-px-3 fw-medium active-scale-094 flex-grow-1"
            [class.active]="cursorType === 'default'" (click)="onCursorDefaultClick($event)">
            Default
          </button>
        </div>
      </div>

      <!-- Direction Section -->
      <div>
        <h6 class="settings-panel__title text-center tw-mb-6 text-uppercase">
          Direction
        </h6>
        <div class="settings-panel__buttons d-flex tw-gap-4">
          <button type="button"
            class="settings-panel__button direction-ltr bg-main-two-600 hover-bg-main-600 tw-duration-300 text-white tw-text-base tw-py-305 tw-px-3 fw-medium active-scale-094 flex-grow-1"
            [class.active]="direction === 'ltr'" (click)="onDirectionLtrClick($event)">
            LTR
          </button>
          <button type="button"
            class="settings-panel__button direction-rtl bg-main-two-600 hover-bg-main-600 tw-duration-300 text-white tw-text-base tw-py-305 tw-px-3 fw-medium active-scale-094 flex-grow-1"
            [class.active]="direction === 'rtl'" (click)="onDirectionRtlClick($event)">
            RTL
          </button>
        </div>
      </div>

    </div>
  </div>

</div>
<!-- ========================== Settings Panel end ==================================== -->

<!--==================== Overlay Start ====================-->
<div class="overlay"></div>
<!--==================== Overlay End ====================-->

<!--==================== Sidebar Overlay End ====================-->
<div class="side-overlay"></div>
<!--==================== Sidebar Overlay End ====================-->

  <!-- Global Toast Container - Available on all pages -->
  <app-toast-container></app-toast-container>

<!-- ==================== Scroll to Top End Here ==================== -->
<div class="progress-wrap" [class.active-progress]="isActiveProgress" (click)="scrollToTop($event)">
  <svg class="progress-circle svg-content" width="100%" height="100%" viewBox="-1 -1 102 102">
    <path #progressPath d="M50,1 a49,49 0 0,1 0,98 a49,49 0 0,1 0,-98" />
  </svg>
</div>
<!-- ==================== Scroll to Top End Here ==================== -->

<!-- Custom Cursor Start -->
<div class="cursor"></div>
<span class="dot"></span>
<!-- Custom Cursor End -->

<app-mobile-menu></app-mobile-menu>
