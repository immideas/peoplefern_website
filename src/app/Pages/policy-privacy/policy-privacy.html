<app-breadcrumb title="Sasstech is here to help you launch"></app-breadcrumb>

<!-- ================== Privacy Policy Start ====================== -->
<section class="privacy-policy py-120">
  <div class="container">
    <div class="row">
      <div class="col-xxl-11">
        <div class="row gy-5">
          <div class="col-md-4">
            <div class="tw-py-13 tw-px-7 bg-neutral-100">
              <div class="nav flex-column nav-pills active-bg-white-border-primary" id="v-pills-tab" role="tablist"
                aria-orientation="vertical">
                <button *ngFor="let tab of tabs"
                  class="nav-link tw-px-8 tw-py-5 text-neutral-500 fw-semibold text-start w-100 tw-rounded-md"
                  [class.active]="tab.active" id="{{ tab.id }}-tab" data-bs-toggle="pill"
                  [attr.data-bs-target]="'#' + tab.id" type="button" role="tab" [attr.aria-controls]="tab.id"
                  [attr.aria-selected]="tab.active">
                  {{ tab.label }}
                </button>
              </div>
            </div>
          </div>

          <div class="col-md-8">
            <div class="tab-content ps-lg-5" id="v-pills-tabContent">
              <div *ngFor="let tab of tabs" [id]="tab.id" class="tab-pane fade" [class.show]="tab.active"
                [class.active]="tab.active" role="tabpanel" [attr.aria-labelledby]="tab.id + '-tab'" tabindex="0"
                [innerHTML]="tab.content"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<!-- ================== Privacy Policy End ====================== -->
<!-- ================================= Task Management Section Start ============================== -->
<section class="task-management bg-pink-more-light-half drag-rotate-element-section @@sectionClass">
  <div class="container">
    <div class="text-end tw--mb-40-px position-relative z-2">
      <img src="assets/images/thumbs/laptop-man.png" alt="Image" class="tw-me-84-px" />
    </div>

    <div class="bg-green-deep tw-rounded-3xl bg-green-deep tw-pt-100-px position-relative z-1">
      <img src="assets/images/shapes/hill-shape.png" alt="Hill Shape"
        class="position-absolute w-100 h-100 top-0 tw-start-0 z-n1" />
      <img src="assets/images/thumbs/task-management-img.png" alt="Image"
        class="position-absolute tw-end-0 top-0 tw-me-5 tw-mt-5 d-lg-block d-none" />

      <div class="tw-mb-8 text-center max-w-570-px mx-auto">
        <div
          class="tw-py-3 tw-px-305 rounded-pill fw-medium text-capitalize tw-leading-none d-inline-flex align-items-center tw-gap-2 tw-mb-405 min-w-max text-white bg-white-13"
          data-aos="fade-up" data-aos-anchor-placement="top-bottom" data-aos-duration="600">
          <div class="">
            Up to <span class="text-yellow text-stroke-yellow">70%</span> off managed cloud hosting
          </div>
        </div>
        <h3 class="splitTextStyleOne text-white">Ready to revolutionize our service?</h3>

        <div class="@@singleBtn">
          <a [routerLink]="'/#'"
            class="hover--translate-y-1 active--translate-y-scale-9 btn btn-main hover-style-one button--stroke d-inline-flex align-items-center justify-content-center tw-gap-5 group active--translate-y-2 tw-px-13 rounded-0 tw-py-6 fw-bold tw-mt-7"
            data-block="button">
            <span class="button__flair"></span>
            <div class="d-flex align-items-center tw-gap-2 z-1">
              <span class="button__label">Download for free</span>
            </div>
          </a>
        </div>
        <div class="@@multipleBtn">
          <div class="d-flex align-items-center tw-gap-4 justify-content-center flex-wrap">
            <a [routerLink]="'/#'"
              class="hover--translate-y-1 active--translate-y-scale-9 btn btn-main hover-style-one button--stroke d-inline-flex align-items-center justify-content-center tw-gap-5 group active--translate-y-2 tw-px-705 tw-rounded-2xl tw-py-6 fw-bold tw-mt-7"
              data-block="button">
              <span class="button__flair"></span>
              <div class="d-flex align-items-center tw-gap-2 z-1">
                <span class="button__label">Get Started Trial</span>
              </div>
            </a>
            <a [routerLink]="'/#'"
              class="hover--translate-y-1 active--translate-y-scale-9 btn hover-style-two button--stroke d-inline-flex align-items-center justify-content-center tw-gap-5 group active--translate-y-2 tw-px-705 tw-rounded-2xl tw-py-6 fw-bold tw-mt-7"
              data-block="button">
              <span class="button__flair"></span>
              <div class="d-flex align-items-center tw-gap-2 z-1">
                <span class="button__label">Get Started Trial</span>
              </div>
            </a>
          </div>
        </div>
      </div>
      <div class="tw-pt-8 text-center">
        <div
          class="myContainer position-relative d-flex flex-wrap align-items-center justify-content-center tw-gap-6 tw-pt-16 overflow-hidden w-100 tw-px-6">
          <span *ngFor="let tag of tags2"
            class="drag-rotate-element cursor-grab min-w-max z-1 tw-px-9 tw-py-2 fw-semibold rounded-pill"
            [ngClass]="[tag.textColor, tag.bgClass]">
            {{ tag.label }}
          </span>
        </div>
      </div>
    </div>
  </div>
</section>
<!-- ================================= Task Management Section End ============================== -->
